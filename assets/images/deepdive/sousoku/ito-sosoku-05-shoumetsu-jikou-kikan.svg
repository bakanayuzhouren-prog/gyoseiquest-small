    <text x="1150" y="290" text-anchor="middle" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="56" font-weight="900" fill="#277564">20</text>
    <text x="979" y="326" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="800" fill="#1F2A24">生命身体・財産権</text>
  
      <rect x="88" y="430" width="1280" height="590" rx="16" fill="#FFFDF6" stroke="#C9D8D1" stroke-width="2"/><rect x="88" y="666" width="1280" height="118" fill="#F1F4F2"/><rect x="88" y="902" width="1280" height="118" fill="#F1F4F2"/><rect x="88" y="430" width="1280" height="118" rx="16" fill="#277564"/><text x="106" y="468" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="900" fill="#fff">権利</text><line x1="518" y1="430" x2="518" y2="548" stroke="#C9D8D1" stroke-width="2"/><text x="536" y="468" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="900" fill="#fff">起算点</text><line x1="1038" y1="430" x2="1038" y2="548" stroke="#C9D8D1" stroke-width="2"/><text x="1056" y="468" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="900" fill="#fff">消滅時効期間</text><line x1="88" y1="548" x2="518" y2="548" stroke="#C9D8D1" stroke-width="2"/><text x="106" y="582" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#1F2A24">債権（主観的）</text><line x1="518" y1="548" x2="518" y2="666" stroke="#C9D8D1" stroke-width="2"/><line x1="518" y1="548" x2="1038" y2="548" stroke="#C9D8D1" stroke-width="2"/><text x="536" y="582" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#1F2A24">債権者が権利を行使できることを知った時</text><line x1="1038" y1="548" x2="1038" y2="666" stroke="#C9D8D1" stroke-width="2"/><line x1="1038" y1="548" x2="1368" y2="548" stroke="#C9D8D1" stroke-width="2"/><text x="1056" y="582" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#1F2A24">5年</text><line x1="88" y1="666" x2="518" y2="666" stroke="#C9D8D1" stroke-width="2"/><text x="106" y="700" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#1F2A24">債権（客観的）</text><line x1="518" y1="666" x2="518" y2="784" stroke="#C9D8D1" stroke-width="2"/><line x1="518" y1="666" x2="1038" y2="666" stroke="#C9D8D1" stroke-width="2"/><text x="536" y="700" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#1F2A24">権利を行使することができる時</text><line x1="1038" y1="666" x2="1038" y2="784" stroke="#C9D8D1" stroke-width="2"/><line x1="1038" y1="666" x2="1368" y2="666" stroke="#C9D8D1" stroke-width="2"/><text x="1056" y="700" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#1F2A24">10年</text><line x1="88" y1="784" x2="518" y2="784" stroke="#C9D8D1" stroke-width="2"/><text x="106" y="818" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#1F2A24">人の生命・身体侵害による損害賠償</text><line x1="518" y1="784" x2="518" y2="902" stroke="#C9D8D1" stroke-width="2"/><line x1="518" y1="784" x2="1038" y2="784" stroke="#C9D8D1" stroke-width="2"/><text x="536" y="818" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#1F2A24">権利を行使することができる時</text><line x1="1038" y1="784" x2="1038" y2="902" stroke="#C9D8D1" stroke-width="2"/><line x1="1038" y1="784" x2="1368" y2="784" stroke="#C9D8D1" stroke-width="2"/><text x="1056" y="818" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#1F2A24">20年</text><line x1="88" y1="902" x2="518" y2="902" stroke="#C9D8D1" stroke-width="2"/><text x="106" y="936" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#1F2A24">債権・所有権以外の財産権</text><line x1="518" y1="902" x2="518" y2="1020" stroke="#C9D8D1" stroke-width="2"/><line x1="518" y1="902" x2="1038" y2="902" stroke="#C9D8D1" stroke-width="2"/><text x="536" y="936" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#1F2A24">権利を行使することができる時</text><line x1="1038" y1="902" x2="1038" y2="1020" stroke="#C9D8D1" stroke-width="2"/><line x1="1038" y1="902" x2="1368" y2="902" stroke="#C9D8D1" stroke-width="2"/><text x="1056" y="936" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#1F2A24">20年</text><rect x="88" y="430" width="1280" height="590" rx="16" fill="none" stroke="#C9D8D1" stroke-width="2"/>
      
    <rect x="145" y="1030" width="1150" height="112" rx="18" fill="#FFFDF6" stroke="#3F6EA8" stroke-width="3"/>
    <rect x="163" y="1048" width="230" height="42" rx="21" fill="#3F6EA8" stroke="#3F6EA8" stroke-width="0"/><text x="278" y="1077" text-anchor="middle" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="900" fill="#fff">試験の急所</text>
    <text x="169" y="1118" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="600" fill="#1F2A24">債権は「知った時5年」と「行使可能時10年」のどちらか早い方。生命身体侵害は20年が出る。</text>
  
    
