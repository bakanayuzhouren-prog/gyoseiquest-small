    <text x="232" y="82" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="38" font-weight="900" fill="#1F2A24">消滅時効期間：5年・10年・20年</text>
    <text x="234" y="120" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="700" fill="#5F6F68">主観的起算点と客観的起算点を分ける</text>
  
  
      
