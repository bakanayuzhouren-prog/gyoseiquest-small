    <text x="290" y="290" text-anchor="middle" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="44" font-weight="900" fill="#3F6EA8">知った</text>
    <text x="119" y="326" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="800" fill="#1F2A24">知った時から</text>
  
      
    <rect x="525" y="180" width="390" height="200" rx="18" fill="#FFF0D8" stroke="#D98632" stroke-width="2"/>
    <rect x="543" y="198" width="190" height="42" rx="21" fill="#D98632" stroke="#D98632" stroke-width="0"/><text x="638" y="227" text-anchor="middle" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="900" fill="#fff">10年</text>
    
    <circle cx="720" cy="280" r="42" fill="#fff" stroke="#D98632" stroke-width="7"/>
    <line x1="720" y1="280" x2="720" y2="256" stroke="#1F2A24" stroke-width="5" stroke-linecap="round"/>
    <line x1="720" y1="280" x2="744" y2="292" stroke="#1F2A24" stroke-width="5" stroke-linecap="round"/>
  
