      <rect x="70" y="450" width="1290" height="472" rx="16" fill="#FFFDF6" stroke="#C9D8D1" stroke-width="2"/><rect x="70" y="686" width="1290" height="118" fill="#F1F4F2"/><rect x="70" y="450" width="1290" height="118" rx="16" fill="#277564"/><text x="88" y="488" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="900" fill="#fff">制度</text><line x1="230" y1="450" x2="230" y2="568" stroke="#C9D8D1" stroke-width="2"/><text x="248" y="488" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="900" fill="#fff">使う相手</text><line x1="440" y1="450" x2="440" y2="568" stroke="#C9D8D1" stroke-width="2"/><text x="458" y="488" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="900" fill="#fff">内容</text><line x1="1100" y1="450" x2="1100" y2="568" stroke="#C9D8D1" stroke-width="2"/><text x="1118" y="488" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="900" fill="#fff">相手方の主観要件</text><line x1="70" y1="568" x2="230" y2="568" stroke="#C9D8D1" stroke-width="2"/><text x="88" y="602" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">催告権</text><line x1="230" y1="568" x2="230" y2="686" stroke="#C9D8D1" stroke-width="2"/><line x1="230" y1="568" x2="440" y2="568" stroke="#C9D8D1" stroke-width="2"/><text x="248" y="602" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">本人</text><line x1="440" y1="568" x2="440" y2="686" stroke="#C9D8D1" stroke-width="2"/><line x1="440" y1="568" x2="1100" y2="568" stroke="#C9D8D1" stroke-width="2"/><text x="458" y="602" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">相当期間を定めて、追認するかどうか確答するよう催告できる。期</text><text x="458" y="630" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">間内に確答がなければ追認拒絶扱い。</text><line x1="1100" y1="568" x2="1100" y2="686" stroke="#C9D8D1" stroke-width="2"/><line x1="1100" y1="568" x2="1360" y2="568" stroke="#C9D8D1" stroke-width="2"/><text x="1118" y="602" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">善悪問わない</text><line x1="70" y1="686" x2="230" y2="686" stroke="#C9D8D1" stroke-width="2"/><text x="88" y="720" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">取消権</text><line x1="230" y1="686" x2="230" y2="804" stroke="#C9D8D1" stroke-width="2"/><line x1="230" y1="686" x2="440" y2="686" stroke="#C9D8D1" stroke-width="2"/><text x="248" y="720" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">本人・無権代理人</text><line x1="440" y1="686" x2="440" y2="804" stroke="#C9D8D1" stroke-width="2"/><line x1="440" y1="686" x2="1100" y2="686" stroke="#C9D8D1" stroke-width="2"/><text x="458" y="720" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">本人が追認するまでは、無権代理人と結んだ契約を取り消せる。本</text><text x="458" y="748" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">人が追認した後は不可。</text><line x1="1100" y1="686" x2="1100" y2="804" stroke="#C9D8D1" stroke-width="2"/><line x1="1100" y1="686" x2="1360" y2="686" stroke="#C9D8D1" stroke-width="2"/><text x="1118" y="720" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">善意</text><line x1="70" y1="804" x2="230" y2="804" stroke="#C9D8D1" stroke-width="2"/><text x="88" y="838" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">117条責任（損</text><text x="88" y="866" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">害賠償）</text><line x1="230" y1="804" x2="230" y2="922" stroke="#C9D8D1" stroke-width="2"/><line x1="230" y1="804" x2="440" y2="804" stroke="#C9D8D1" stroke-width="2"/><text x="248" y="838" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">無権代理人</text><line x1="440" y1="804" x2="440" y2="922" stroke="#C9D8D1" stroke-width="2"/><line x1="440" y1="804" x2="1100" y2="804" stroke="#C9D8D1" stroke-width="2"/><text x="458" y="838" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">代理権を証明できず、本人の追認もないとき、相手方の選択で履行</text><text x="458" y="866" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">又は損害賠償。ただし取消後は不可。</text><line x1="1100" y1="804" x2="1100" y2="922" stroke="#C9D8D1" stroke-width="2"/><line x1="1100" y1="804" x2="1360" y2="804" stroke="#C9D8D1" stroke-width="2"/><text x="1118" y="838" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">善意無過失</text><rect x="70" y="450" width="1290" height="472" rx="16" fill="none" stroke="#C9D8D1" stroke-width="2"/>
      
    <rect x="150" y="970" width="1140" height="145" rx="18" fill="#FFFDF6" stroke="#277564" stroke-width="3"/>
    <rect x="168" y="988" width="230" height="42" rx="21" fill="#277564" stroke="#277564" stroke-width="0"/><text x="283" y="1017" text-anchor="middle" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="900" fill="#fff">試験の急所</text>
    <text x="174" y="1058" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="600" fill="#1F2A24">表見代理が成立し得る場面でも、相手方は無権代理人責任を選べることがある。</text><text x="174" y="1096" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="600" fill="#1F2A24">ただし、相手方が取消権を行使した後は117条責任を追及できない。</text>
  
    
