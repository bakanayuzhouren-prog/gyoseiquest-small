oke="#C9D8D1" stroke-width="2"/><text x="72" y="550" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">不確定期限あり</text><line x1="364" y1="516" x2="364" y2="584" stroke="#C9D8D1" stroke-width="2"/><line x1="364" y1="516" x2="794" y2="516" stroke="#C9D8D1" stroke-width="2"/><text x="382" y="550" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">期限到来時</text><line x1="794" y1="516" x2="794" y2="584" stroke="#C9D8D1" stroke-width="2"/><line x1="794" y1="516" x2="1354" y2="516" stroke="#C9D8D1" stroke-width="2"/><text x="812" y="550" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">期限到来後の請求時 又は 期限到来を知った時</text><line x1="54" y1="584" x2="364" y2="584" stroke="#C9D8D1" stroke-width="2"/><text x="72" y="618" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">期限の定めなし</text><line x1="364" y1="584" x2="364" y2="652" stroke="#C9D8D1" stroke-width="2"/><line x1="364" y1="584" x2="794" y2="584" stroke="#C9D8D1" stroke-width="2"/><text x="382" y="618" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">債権成立時</text><line x1="794" y1="584" x2="794" y2="652" stroke="#C9D8D1" stroke-width="2"/><line x1="794" y1="584" x2="1354" y2="584" stroke="#C9D8D1" stroke-width="2"/><text x="812" y="618" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">履行請求を受けた時（412条3項）</text><line x1="54" y1="652" x2="364" y2="652" stroke="#C9D8D1" stroke-width="2"/><text x="72" y="686" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" fill="#1F2A24">停止条件付</text><line x1="364" y1="6