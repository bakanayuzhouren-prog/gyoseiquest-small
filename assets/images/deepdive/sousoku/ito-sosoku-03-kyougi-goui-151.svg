        <text x="1148" y="292" text-anchor="middle" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="56" font-weight="900" fill="#3F6EA8">5年</text>
      
    <text x="982" y="342" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="800" fill="#1F2A24">再合意しても通算5年</text>
  
      <rect x="100" y="445" width="1240" height="520" rx="16" fill="#FFFDF6" stroke="#C9D8D1" stroke-width="2"/><rect x="100" y="653" width="1240" height="104" fill="#F1F4F2"/><rect x="100" y="861" width="1240" height="104" fill="#F1F4F2"/><rect x="100" y="445" width="1240" height="104" rx="16" fill="#277564"/><text x="118" y="483" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="900" fill="#fff">完成猶予が終わる時点</text><line x1="450" y1="445" x2="450" y2="549" stroke="#C9D8D1" stroke-width="2"/><text x="468" y="483" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="900" fill="#fff">内容</text><line x1="100" y1="549" x2="450" y2="549" stroke="#C9D8D1" stroke-width="2"/><text x="118" y="583" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" fill="#1F2A24">合意から1年</text><line x1="450" y1="549" x2="450" y2="653" stroke="#C9D8D1" stroke-width="2"/><line x1="450" y1="549" x2="1340" y2="549" stroke="#C9D8D1" stroke-width="2"/><text x="468" y="583" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" fill="#1F2A24">期間を定めない合意なら、原則ここまで猶予</text><line x1="100" y1="653" x2="450" y2="653" stroke="#C9D8D1" stroke-width="2"/><text x="118" y="687" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" fill="#1F2A24">協議期間を定めた場合</text><line x1="450" y1="653" x2="450" y2="757" stroke="#C9D8D1" stroke-width="2"/><line x1="450" y1="653" x2="1340" y2="653" stroke="#C9D8D1" stroke-width="2"/><text x="468" y="687" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" fill="#1F2A24">その期間が経過した時まで猶予</text><line x1="100" y1="757" x2="450" y2="757" stroke="#C9D8D1" stroke-width="2"/><text x="118" y="791" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" fill="#1F2A24">協議拒絶の通知</text><line x1="450" y1="757" x2="450" y2="861" stroke="#C9D8D1" stroke-width="2"/><line x1="450" y1="757" x2="1340" y2="757" stroke="#C9D8D1" stroke-width="2"/><text x="468" y="791" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" fill="#1F2A24">一方が続行拒絶を通知したときは、通知から6か月まで猶予</text><line x1="100" y1="861" x2="450" y2="861" stroke="#C9D8D1" stroke-width="2"/><text x="118" y="895" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" fill="#1F2A24">再度の合意</text><line x1="450" y1="861" x2="450" y2="965" stroke="#C9D8D1" stroke-width="2"/><line x1="450" y1="861" x2="1340" y2="861" stroke="#C9D8D1" stroke-width="2"/><text x="468" y="895" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" fill="#1F2A24">再合意は可能。ただし完成猶予の通算は5年を超えられない</text><rect x="100" y="445" width="1240" height="520" rx="16" fill="none" stroke="#C9D8D1" stroke-width="2"/>
      
    <rect x="170" y="990" width="1100" height="150" rx="18" fill="#FFFDF6" stroke="#6D5CA8" stroke-width="3"/>
    <rect x="188" y="1008" width="230" height="42" rx="21" fill="#6D5CA8" stroke="#6D5CA8" stroke-width="0"/><text x="303" y="1037" text-anchor="middle" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="900" fill="#fff">一言で</text>
    <text x="194" y="1078" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="600" fill="#1F2A24">151条は「交渉中だけ時効完成を待ってもらう制度」。承認のように時効を更新する制度では</text><text x="194" y="1116" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="600" fill="#1F2A24">ない。</text>
  
    
