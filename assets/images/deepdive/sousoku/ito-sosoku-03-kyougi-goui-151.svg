    <text x="232" y="82" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="38" font-weight="900" fill="#1F2A24">151条：協議を行う旨の合意</text>
    <text x="234" y="120" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="700" fill="#5F6F68">話合い中に時効完成する事故を防ぐ</text>
  
  
      
