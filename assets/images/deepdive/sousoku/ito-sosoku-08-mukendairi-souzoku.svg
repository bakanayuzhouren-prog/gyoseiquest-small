      <rect x="70" y="410" width="1250" height="588" rx="16" fill="#FFFDF6" stroke="#C9D8D1" stroke-width="2"/><rect x="70" y="606" width="1250" height="98" fill="#F1F4F2"/><rect x="70" y="802" width="1250" height="98" fill="#F1F4F2"/><rect x="70" y="410" width="1250" height="98" rx="16" fill="#277564"/><text x="88" y="448" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="900" fill="#fff">場面</text><line x1="460" y1="410" x2="460" y2="508" stroke="#C9D8D1" stroke-width="2"/><text x="478" y="448" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="900" fill="#fff">結論</text><line x1="890" y1="410" x2="890" y2="508" stroke="#C9D8D1" stroke-width="2"/><text x="908" y="448" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="900" fill="#fff">理由・試験処理</text><line x1="70" y1="508" x2="460" y2="508" stroke="#C9D8D1" stroke-width="2"/><text x="88" y="542" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">無権代理人が本人を単独相続</text><line x1="460" y1="508" x2="460" y2="606" stroke="#C9D8D1" stroke-width="2"/><line x1="460" y1="508" x2="890" y2="508" stroke="#C9D8D1" stroke-width="2"/><text x="478" y="542" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">追認拒絶できない</text><line x1="890" y1="508" x2="890" y2="606" stroke="#C9D8D1" stroke-width="2"/><line x1="890" y1="508" x2="1320" y2="508" stroke="#C9D8D1" stroke-width="2"/><text x="908" y="542" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">信義則上、本人の地位で拒絶するのは許さ</text><text x="908" y="571" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">れない</text><line x1="70" y1="606" x2="460" y2="606" stroke="#C9D8D1" stroke-width="2"/><text x="88" y="640" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">本人が無権代理人を相続</text><line x1="460" y1="606" x2="460" y2="704" stroke="#C9D8D1" stroke-width="2"/><line x1="460" y1="606" x2="890" y2="606" stroke="#C9D8D1" stroke-width="2"/><text x="478" y="640" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">追認拒絶できる</text><line x1="890" y1="606" x2="890" y2="704" stroke="#C9D8D1" stroke-width="2"/><line x1="890" y1="606" x2="1320" y2="606" stroke="#C9D8D1" stroke-width="2"/><text x="908" y="640" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">本人としての資格は残る。ただし無権代理</text><text x="908" y="669" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">人責任も相続し得る</text><line x1="70" y1="704" x2="460" y2="704" stroke="#C9D8D1" stroke-width="2"/><text x="88" y="738" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">無権代理人が本人を共同相続</text><line x1="460" y1="704" x2="460" y2="802" stroke="#C9D8D1" stroke-width="2"/><line x1="460" y1="704" x2="890" y2="704" stroke="#C9D8D1" stroke-width="2"/><text x="478" y="738" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">当然有効にはならない</text><line x1="890" y1="704" x2="890" y2="802" stroke="#C9D8D1" stroke-width="2"/><line x1="890" y1="704" x2="1320" y2="704" stroke="#C9D8D1" stroke-width="2"/><text x="908" y="738" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">追認は共同相続人全員で行う必要</text><line x1="70" y1="802" x2="460" y2="802" stroke="#C9D8D1" stroke-width="2"/><text x="88" y="836" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">本人が追認拒絶後、無権代理人が相続</text><line x1="460" y1="802" x2="460" y2="900" stroke="#C9D8D1" stroke-width="2"/><line x1="460" y1="802" x2="890" y2="802" stroke="#C9D8D1" stroke-width="2"/><text x="478" y="836" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">有効化しない</text><line x1="890" y1="802" x2="890" y2="900" stroke="#C9D8D1" stroke-width="2"/><line x1="890" y1="802" x2="1320" y2="802" stroke="#C9D8D1" stroke-width="2"/><text x="908" y="836" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">既に確定した追認拒絶の効果は消えない</text><line x1="70" y1="900" x2="460" y2="900" stroke="#C9D8D1" stroke-width="2"/><text x="88" y="934" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">無権代理人を相続した者が本人も相続</text><line x1="460" y1="900" x2="460" y2="998" stroke="#C9D8D1" stroke-width="2"/><line x1="460" y1="900" x2="890" y2="900" stroke="#C9D8D1" stroke-width="2"/><text x="478" y="934" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">追認拒絶できない方向</text><line x1="890" y1="900" x2="890" y2="998" stroke="#C9D8D1" stroke-width="2"/><line x1="890" y1="900" x2="1320" y2="900" stroke="#C9D8D1" stroke-width="2"/><text x="908" y="934" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">最終的に無権代理人の責任を負う地位を引</text><text x="908" y="963" text-anchor="start" font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" fill="#1F2A24">き継ぐため</text><rect x="70" y="410" width="1250" height="588" rx="16" fill="none" stroke="#C9D8D1" stroke-width="2"/>
      
